<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Corrigo Helper Options</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header class="topbar">
    <h1>Corrigo Work-Order Helper</h1>
    <button id="settingsBtn" class="settings-btn" type="button">Settings</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="wos">WOs</button>
    <button class="tab" data-tab="overview">Overview</button>
  </nav>

  <main class="content">
    <section id="tab-wos" class="tabpanel active">
      <div class="toolbar">
        <button id="btnScrape" class="primary">Scrape</button>
        <button id="btnRefresh">Refresh</button>
        <label style="display:flex;align-items:center;gap:6px;">
          <input id="cbOnlyToUpdate" type="checkbox" checked>
          <span class="muted">Only show WOs to be updated</span>
        </label>
        <span id="lastScrape" class="muted"></span>
        <span id="scrapeWarn" class="warn" hidden>Reminder: please scrape – last scrape was yesterday.</span>
        <label style="margin-left:auto;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="cbHideInactive" checked>
          <span class="muted">Hide inactive WOs</span>
        </label>
        <span id="woCounts" class="muted"></span>
      </div>
      <div class="legend">
        <span class="legend-item to-review"><span class="legend-chip"></span>To be reviewed (no review or newer log)</span>
        <span class="legend-item reviewed"><span class="legend-chip"></span>Activity log reviewed</span>
        <span class="legend-item last-viewed"><span class="legend-chip"></span>Last viewed activity log</span>
        <span class="legend-item inactive"><span class="legend-chip"></span>Inactive</span>
      </div>
      <div class="mainarea">
        <div class="tablewrap">
          <table id="wosTable"></table>
        </div>
         <aside id="sidebar" class="sidebar collapsed">
            <button id="sidebarClose" class="sidebar-close" aria-label="Close activity log sidebar">×</button>
            <div class="sidebar-toggle" id="sidebarToggle">❯</div>
          <div class="sidebar-body">
            <div id="sidebarInner"></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="tab-overview" class="tabpanel">
      <div class="toolbar">
        <span class="muted">This renders from stored WOs and last updates.</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
          <label style="display:flex;align-items:center;gap:6px;">
            <input id="cbAsOfNextWeekDay" type="checkbox">
            <span class="muted">For next week day</span>
          </label>
          <label for="darknessSlider" class="muted">Darkness</label>
          <input id="darknessSlider" type="range" min="0" max="100" step="1" value="50">
          <span id="darknessValue" class="muted">50%</span>
        </div>
      </div>
      <iframe id="overviewFrame" src="../overview.html" class="overview-frame"></iframe>
    </section>
  </main>

  <script src="../util/storage.js"></script>
  <script src="app.js"></script>

  <div id="settingsModal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Highlight Settings</div>
        <div class="modal-actions">
          <button id="btnSetAlways" type="button" class="primary">Always highlight</button>
          <button id="btnSetNever" type="button">Never highlight</button>
          <button id="btnMoveToAlways" type="button" class="primary" hidden>Move to always</button>
          <button id="btnMoveToNever" type="button" hidden>Move to never</button>
          <button id="settingsClose" type="button">Close</button>
        </div>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="pending">Pending</button>
        <button class="modal-tab" data-tab="always">Always highlight</button>
        <button class="modal-tab" data-tab="never">Never highlight</button>
      </div>
      <div class="modal-body">
        <div id="modalTabPending" class="modal-panel active"></div>
        <div id="modalTabAlways" class="modal-panel"></div>
        <div id="modalTabNever" class="modal-panel"></div>
      </div>
    </div>
  </div>
</body>
  
</html>
